# HELIX Gold Metric Definitions (v0.10.0)
# Your institution's definition of truth. Edit, then have each owner approve.
helix_version: 0.10.0
title: HELIX Gold Metric Definitions
description: Standard higher education metrics, defined once, owned by the institution. Copy this file, change what
  your institution does differently, and have each metric's owner sign it. tools/build_context_pack.py turns each
  metric into a skill file agents can read.
how_to_customize:
- Keep the id stable; dashboards and agents refer to it
- Record every change in 'local_changes' with who approved it
- Set approved_by and approved_date only after the owner signs off
metrics:
- id: census_headcount
  name: Census headcount
  domain: Enrollment & Registration
  owner_role: University Registrar
  grain: One number per academic period, broken down by level, full or part time, and program
  population:
  - Students with at least one Enrollment in the period whose enrollment_status is registered, enrolled, completed,
    or incomplete as of the period's census_date
  - Exclude auditing-only and dropped enrollments
  - Count each student once
  formula: COUNT(DISTINCT enrollment.student_ref) as of academic_period.census_date
  sources:
  - enrollment.student_ref
  - enrollment.enrollment_status
  - enrollment.enrollment_date
  - enrollment.drop_date
  - enrollment.academic_period_ref
  - academic_period.census_date
  - student.academic_level
  - student.full_part_time
  standard: IPEDS Fall Enrollment (12-month and fall census); state reporting may define census differently
  output_classification: internal
  suppression: Suppress any cell under 5 when published by demographic
  notes: Use the snapshot taken at census, not today's enrollment rows; late drops change history otherwise.
  version: '0.1'
  approved_by: ''
  approved_date: ''
  local_changes: []
- id: credit_hours_fte
  name: Credit hours and FTE
  domain: Enrollment & Registration
  owner_role: University Registrar
  grain: Per academic period and level
  population:
  - Same as census headcount
  formula: SUM(enrollment.credit_hours_attempted) at census; FTE = undergraduate credit hours / 15 + graduate credit
    hours / 12 for a semester (set divisors to your state or IPEDS rule)
  sources:
  - enrollment.credit_hours_attempted
  - enrollment.enrollment_status
  - academic_period.census_date
  - student.academic_level
  standard: IPEDS 12-month enrollment instructional activity; divisors vary by calendar and state
  output_classification: internal
  suppression: None at institution level
  notes: Write the divisors into the metric, not into a dashboard.
  version: '0.1'
  approved_by: ''
  approved_date: ''
  local_changes: []
- id: fall_to_fall_retention
  name: Fall-to-fall retention (first-time, full-time)
  domain: Outcomes
  owner_role: Director of Institutional Research
  grain: Per entering fall cohort
  population:
  - 'Cohort: student_type first_time_freshman, full_part_time full_time, entering in a fall period'
  - Exclude students who left for the IPEDS-allowed reasons (death, total disability, military, foreign service,
    official church mission)
  formula: Cohort members enrolled at the next fall census, or who completed a credential before it, / cohort size
  sources:
  - student.student_type
  - student.full_part_time
  - student.cohort
  - student.admit_period_ref
  - enrollment.student_ref
  - enrollment.academic_period_ref
  - academic_period.census_date
  - degree.conferral_date
  standard: IPEDS Fall Enrollment retention rate
  output_classification: internal
  suppression: Suppress subgroup rates when the subgroup cohort is under 5
  notes: Freeze the cohort at the entering census and never re-derive it from current student rows.
  version: '0.1'
  approved_by: ''
  approved_date: ''
  local_changes: []
- id: graduation_rate_150
  name: Graduation rate within 150 percent of normal time
  domain: Outcomes
  owner_role: Director of Institutional Research
  grain: Per entering cohort
  population:
  - IPEDS Graduation Rates cohort (first-time, full-time, degree-seeking)
  - Same allowable exclusions as retention
  formula: Cohort members with a conferred degree within 6 years (bachelor's) or 3 years (associate) of entry /
    adjusted cohort
  sources:
  - student.cohort
  - degree.student_ref
  - degree.conferral_date
  - degree.degree_level
  - degree.degree_status
  standard: IPEDS Graduation Rates (GR)
  output_classification: internal
  suppression: Suppress subgroups under 5
  notes: Count degrees from this institution only; transfers-out are reported separately.
  version: '0.1'
  approved_by: ''
  approved_date: ''
  local_changes: []
- id: admissions_yield
  name: Admissions yield
  domain: Enrollment & Registration
  owner_role: Director of Admissions
  grain: Per admit period, application type, and program
  population:
  - Applications with application_status admitted or conditionally_admitted
  formula: Admitted applicants enrolled at census / admitted applicants
  sources:
  - admission_application.application_status
  - admission_application.admit_period_ref
  - admission_application.application_type
  - admission_application.program_ref
  - enrollment.student_ref
  - academic_period.census_date
  standard: Common Data Set C1 definitions
  output_classification: internal
  suppression: Suppress subgroups under 5
  notes: Use enrollment at census, not deposit, as the numerator.
  version: '0.1'
  approved_by: ''
  approved_date: ''
  local_changes: []
- id: summer_melt
  name: Summer melt
  domain: Enrollment & Registration
  owner_role: Director of Admissions
  grain: Per fall admit period
  population:
  - Admitted applicants with enrollment_deposit_paid true or enrollment_intent confirmed
  formula: Confirmed admits not enrolled at fall census / confirmed admits
  sources:
  - admission_application.enrollment_deposit_paid
  - admission_application.enrollment_intent
  - admission_application.admit_period_ref
  - enrollment.student_ref
  - academic_period.census_date
  standard: Institutional definition; document whether deposit or intent defines confirmed
  output_classification: internal
  suppression: Suppress subgroups under 5
  notes: See core/examples for the melt risk model built on this population.
  version: '0.1'
  approved_by: ''
  approved_date: ''
  local_changes: []
- id: unmet_need_avg
  name: Average unmet need
  domain: Financial Aid
  owner_role: Director of Financial Aid
  grain: Per aid year and student segment
  population:
  - Students with an AidPackage in packaged or finalized status for the aid year
  formula: AVG(aid_package.unmet_need), where unmet_need = max(need minus need-based aid, 0)
  sources:
  - aid_package.unmet_need
  - aid_package.need
  - aid_package.packaging_status
  - aid_package.academic_year
  standard: Common Data Set H2 for aided first-year students
  output_classification: confidential
  suppression: Aggregate only; suppress cells under 5; never per student outside financial aid roles (GLBA)
  notes: Built from restricted data; publish only aggregates.
  version: '0.1'
  approved_by: ''
  approved_date: ''
  local_changes: []
- id: pell_share
  name: Pell recipient share
  domain: Financial Aid
  owner_role: Director of Financial Aid
  grain: Per academic year and level
  population:
  - Undergraduates enrolled at fall census
  formula: Students with a disbursed Pell award in the aid year / undergraduates at census
  sources:
  - fin_aid_award.fund_code
  - fin_aid_award.award_status
  - fin_aid_award.academic_year
  - enrollment.student_ref
  - student.academic_level
  standard: IPEDS Student Financial Aid (SFA)
  output_classification: internal
  suppression: Suppress subgroups under 5
  notes: Identify Pell by the fund code crosswalk, not by fund name.
  version: '0.1'
  approved_by: ''
  approved_date: ''
  local_changes: []
- id: student_employee_hours_risk
  name: Students working over 20 hours a week
  domain: Financial Aid
  owner_role: Director of Student Success
  grain: Per academic period
  population:
  - Undergraduates enrolled at census with a StudentEmployment record active in the period
  formula: Students whose hours_per_week_max is over 20 / enrolled undergraduates with campus jobs
  sources:
  - student_employment.hours_per_week_max
  - student_employment.position_start_date
  - student_employment.position_end_date
  - student.academic_level
  - enrollment.student_ref
  standard: Institutional
  output_classification: confidential
  suppression: Aggregate only outside advising and student employment roles
  notes: Crosses the student system and HR. One of the questions no single vendor's analytics can answer.
  version: '0.1'
  approved_by: ''
  approved_date: ''
  local_changes: []
- id: section_fill_rate
  name: Section fill rate
  domain: Academic Structure
  owner_role: University Registrar
  grain: Per section, rolled up by department and period
  population:
  - Sections with section_status active and max_enrollment over 0
  formula: actual_enrollment / max_enrollment at census
  sources:
  - course_section.actual_enrollment
  - course_section.max_enrollment
  - course_section.section_status
  - course_section.academic_org_ref
  - course_section.academic_period_ref
  standard: Institutional
  output_classification: internal
  suppression: None
  notes: Combine cross-listed sections before computing.
  version: '0.1'
  approved_by: ''
  approved_date: ''
  local_changes: []
- id: instructional_cost_per_credit_hour
  name: Instructional cost per credit hour
  domain: Financial Operations
  owner_role: Director of Budget
  grain: Per department and fiscal year
  population:
  - Instructional salary and benefit expense coded to instruction
  - Credit hours from sections owned by the department
  formula: Instructional expense / SUM(enrollment.credit_hours_attempted) for sections the department owns
  sources:
  - gl_transaction
  - course_section.academic_org_ref
  - enrollment.credit_hours_attempted
  standard: Delaware Cost Study style; document your expense rules
  output_classification: internal
  suppression: None at department level
  notes: Needs Financials, HR, and the student system in one place. Write the expense account rules into this definition.
  version: '0.1'
  approved_by: ''
  approved_date: ''
  local_changes: []
- id: faculty_headcount_ipeds
  name: Faculty headcount by rank and tenure
  domain: Human Resources
  owner_role: Director of HR Systems
  grain: Per November 1 snapshot
  population:
  - Employees with employment_status active on November 1 whose job classification is instructional
  formula: COUNT(DISTINCT employee.helix_id) by job_classification.academic_rank and tenure_status
  sources:
  - employee.employment_status
  - employee.hire_date
  - employee.termination_date
  - job_classification.academic_rank
  - job_classification.tenure_status
  - job_classification.ipeds_faculty_category
  standard: IPEDS Human Resources (HR) survey
  output_classification: internal
  suppression: Suppress subgroup cells under 5
  notes: Workday has no delivered tenure or rank fields; see the JobClassification mapping.
  version: '0.1'
  approved_by: ''
  approved_date: ''
  local_changes: []
- id: donor_participation
  name: Alumni giving participation
  domain: Advancement
  owner_role: Director of Advancement Services
  grain: Per fiscal year
  population:
  - Solicitable alumni of record (constituent_type alumni, status active, not do_not_solicit)
  formula: Alumni with at least one gift in the fiscal year / solicitable alumni of record
  sources:
  - constituent.constituent_type
  - constituent.status
  - gift.constituent_ref
  - gift.gift_date
  - gift.gift_type
  standard: CASE Global Reporting Standards
  output_classification: internal
  suppression: None at institution level
  notes: Count pledge payments in the year they're paid; count pledges per CASE rules.
  version: '0.1'
  approved_by: ''
  approved_date: ''
  local_changes: []
- id: dollars_raised_case
  name: Dollars raised (CASE)
  domain: Advancement
  owner_role: Director of Advancement Services
  grain: Per fiscal year and campaign
  population:
  - Gifts and new pledges dated in the fiscal year
  formula: SUM(gift.amount) for outright gifts and new pledges; pledge payments excluded to avoid double counting
  sources:
  - gift.amount
  - gift.gift_type
  - gift.gift_date
  - gift.campaign_ref
  standard: CASE Global Reporting Standards
  output_classification: internal
  suppression: None
  notes: Planned gifts at present value per CASE.
  version: '0.1'
  approved_by: ''
  approved_date: ''
  local_changes: []
