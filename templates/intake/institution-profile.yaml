# HELIX Institution Profile (machine-readable)
# Step 1 of START_HERE.md. Mirrors institution-profile.md.
# An AI assistant loaded with agents/helix-migration-companion.json can read this file
# and recommend your first slice and next documents.

helix_profile_version: "0.1"

institution:
  name: ""
  control: ""            # public | private
  student_headcount: null
  employee_headcount: null
  ipeds_unit_id: ""
  fiscal_year_start: ""  # e.g. "07-01"
  academic_calendar: ""  # semester | quarter | trimester | other

