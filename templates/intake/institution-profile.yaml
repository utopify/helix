    erp: ""              # peoplesoft | banner | workday | colleague | other
    module: ""           # campus_solutions | hcm | fscm | interaction_hub | epm | other
    app_version: ""      # e.g. PeopleSoft CS 9.2, PeopleTools 8.61
    database: ""         # e.g. Oracle 19c
    hosting: ""          # on_prem | aws_ec2 | oci | saas | other
    role: ""             # production | reporting_copy | standby | dev | archive
    refresh: ""          # real_time | nightly | weekly | monthly | ad_hoc
    access: ""           # jdbc | odbc | db_link | api | file_export
    owner: ""

